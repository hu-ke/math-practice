<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橄榄树口算冒险小达人</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-bg" id="stars-bg"></div>
    <!-- 马里奥装饰元素 -->
    <div class="mario-decorations">
        <!-- 蘑菇装饰 -->
        <div class="mushroom mushroom-1">🍄</div>
        <div class="mushroom mushroom-2">🍄</div>
        <div class="mushroom mushroom-3">🍄</div>
        <!-- 金币装饰 -->
        <div class="coin coin-1">🪙</div>
        <div class="coin coin-2">🪙</div>
        <div class="coin coin-3">🪙</div>
        <!-- 星星装饰 -->
        <div class="star star-1">⭐</div>
        <div class="star star-2">⭐</div>
        <div class="star star-3">⭐</div>
        <!-- 管道装饰 -->
        <div class="pipe pipe-1"></div>
        <div class="pipe pipe-2"></div>
        <!-- 砖块装饰 -->
        <div class="brick brick-1"></div>
        <div class="brick brick-2"></div>
        <div class="brick brick-3"></div>
    </div>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='35' r='18' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Ccircle cx='43' cy='32' r='3' fill='%23333'/%3E%3Ccircle cx='57' cy='32' r='3' fill='%23333'/%3E%3Cpath d='M44 40 Q50 46 56 40' stroke='%23333' stroke-width='2' fill='none'/%3E%3Crect x='40' y='55' width='20' height='25' rx='5' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Crect x='30' y='58' width='12' height='6' rx='3' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Crect x='58' y='58' width='12' height='6' rx='3' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Crect x='42' y='80' width='8' height='12' rx='3' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Crect x='50' y='80' width='8' height='12' rx='3' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Cpolygon points='50,8 53,16 62,16 55,22 58,30 50,25 42,30 45,22 38,16 47,16' fill='%23FFD700' stroke='%23FFA500' stroke-width='1'/%3E%3C/svg%3E" alt="星星人" width="60">
                </div>
                <div class="header-title">
                    <h1>橄榄树口算冒险小达人</h1>
                    <p>每天50题，收集星星，探索宇宙！</p>
                </div>
                <div class="trophy">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,5 61,35 95,35 68,55 79,90 50,70 21,90 32,55 5,35 39,35' fill='%23FFD700' stroke='%23FFA500' stroke-width='2'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23FFA500'/%3E%3Ctext x='50' y='56' text-anchor='middle' font-size='18' fill='white' font-weight='bold'%3E1%3C/text%3E%3C/svg%3E" alt="星星" width="45">
                </div>
            </div>
            <nav class="app-nav">
                <div class="nav-item active">开始冒险</div>
                <div class="nav-item">多人比赛</div>
                <div class="nav-item">错题本</div>
                <div class="nav-item">我的奖励</div>
                <div class="nav-item">冒险日志</div>
            </nav>
        </header>

        <!-- 主要内容区域 -->
        <main class="app-main">
            <!-- 年级选择 -->
            <section class="grade-section">
                <h2>选择冒险等级</h2>
                <div class="grade-buttons">
                    <button class="grade-btn" data-grade="1" id="grade1-btn">
                        <span class="btn-icon">🌟</span>
                        一年级
                    </button>
                    <button class="grade-btn" data-grade="2">
                        <span class="btn-icon">⭐</span>
                        二年级
                    </button>
                    <button class="grade-btn" data-grade="3">
                        <span class="btn-icon">💫</span>
                        三年级
                    </button>
                    <button class="grade-btn" data-grade="4">
                        <span class="btn-icon">🌠</span>
                        四年级
                    </button>
                    <button class="grade-btn" data-grade="5">
                        <span class="btn-icon">🌌</span>
                        五年级
                    </button>
                </div>
            </section>
            
            <!-- 子目录选择 -->
            <section class="sub-grade-section" id="sub-grade-section" style="display: none;">
                <h2 id="sub-grade-title">练习模式</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="basic">
                        <span class="sub-btn-icon">📚</span>
                        <span class="sub-btn-title">基础练习</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="comprehensive">
                        <span class="sub-btn-icon">🎯</span>
                        <span class="sub-btn-title">综合练习</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-grade-btn">← 返回年级选择</button>
            </section>

            <!-- 一年级基础练习二级子目录 -->
            <section class="sub-grade-section" id="sub-sub-grade-section" style="display: none;">
                <h2 id="sub-sub-grade-title">基础练习类型</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="within10">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">10以内加减法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="within20">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">20以内加减法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="currency">
                        <span class="sub-btn-icon">💰</span>
                        <span class="sub-btn-title">元角分练习</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-sub-grade-btn">← 返回练习模式</button>
            </section>

            <!-- 二年级基础练习二级子目录 -->
            <section class="sub-grade-section" id="sub-sub-grade-section-2" style="display: none;">
                <h2 id="sub-sub-grade-title-2">基础练习类型</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="within100">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">100以内加减法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="multiplication">
                        <span class="sub-btn-icon">✖️</span>
                        <span class="sub-btn-title">表内乘除法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="units">
                        <span class="sub-btn-icon">📏</span>
                        <span class="sub-btn-title">长度重量单位换算</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-sub-grade-btn-2">← 返回练习模式</button>
            </section>

            <!-- 三年级基础练习二级子目录 -->
            <section class="sub-grade-section" id="sub-sub-grade-section-3" style="display: none;">
                <h2 id="sub-sub-grade-title-3">基础练习类型</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="within10000">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">万以内加减法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="twoDigitMultDiv">
                        <span class="sub-btn-icon">✖️</span>
                        <span class="sub-btn-title">两位数乘除法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="decimalBasic">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">简单的小数加减</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-sub-grade-btn-3">← 返回练习模式</button>
            </section>

            <!-- 四年级基础练习二级子目录 -->
            <section class="sub-grade-section" id="sub-sub-grade-section-4" style="display: none;">
                <h2 id="sub-sub-grade-title-4">基础练习类型</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="threeDigitTwoDigitMult">
                        <span class="sub-btn-icon">✖️</span>
                        <span class="sub-btn-title">三位数乘两位数乘法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="twoDigitDiv">
                        <span class="sub-btn-icon">➗</span>
                        <span class="sub-btn-title">两位数除法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="decimalAddSub">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">小数加减法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="unitConversion">
                        <span class="sub-btn-icon">📏</span>
                        <span class="sub-btn-title">度量单位换算</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-sub-grade-btn-4">← 返回练习模式</button>
            </section>

            <!-- 五年级基础练习二级子目录 -->
            <section class="sub-grade-section" id="sub-sub-grade-section-5" style="display: none;">
                <h2 id="sub-sub-grade-title-5">基础练习类型</h2>
                <div class="sub-grade-buttons">
                    <button class="sub-grade-btn" data-subgrade="decimalMult">
                        <span class="sub-btn-icon">✖️</span>
                        <span class="sub-btn-title">小数乘法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="decimalDiv">
                        <span class="sub-btn-icon">➗</span>
                        <span class="sub-btn-title">小数除法</span>
                    </button>
                    <button class="sub-grade-btn" data-subgrade="fractionAddSub">
                        <span class="sub-btn-icon">🔢</span>
                        <span class="sub-btn-title">分数加减法</span>
                    </button>
                </div>
                <button class="back-to-grade-btn" id="back-to-sub-grade-btn-5">← 返回练习模式</button>
            </section>

            <!-- 练习区域 -->
            <section class="practice-section" id="practice-section">
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-icon">📝</div>
                        <div class="stat-number">50</div>
                        <div class="stat-label">总题数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">✅</div>
                        <div class="stat-number" id="correct-count">0</div>
                        <div class="stat-label">正确数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏱️</div>
                        <div class="stat-number" id="time-used">0</div>
                        <div class="stat-label">用时(秒)</div>
                    </div>
                </div>
                
                <div class="questions-container" id="questions-container">
                </div>
                
                <div class="action-buttons">
                    <button class="submit-btn" id="submit-btn">提交所有答案</button>
                    <button class="reset-btn" id="reset-btn">重新开始</button>
                </div>
            </section>
            
            <!-- 多人比赛区域 -->
            <section class="battle-section" id="battle-section" style="display: none;">
                <!-- 比赛设置 -->
                <div class="battle-setup" id="battle-setup">
                    <h2>多人比赛模式</h2>
                    <p class="battle-desc">选择参赛人数和年级，一起比拼口算速度！</p>
                    
                    <div class="battle-config">
                        <div class="config-item">
                            <label>参赛人数</label>
                            <div class="player-count-btns">
                                <button class="count-btn active" data-count="2">2人</button>
                                <button class="count-btn" data-count="3">3人</button>
                                <button class="count-btn" data-count="4">4人</button>
                            </div>
                        </div>
                        
                        <div class="config-item">
                            <label>比赛年级</label>
                            <div class="battle-grade-btns">
                                <button class="battle-grade-btn active" data-grade="1">一年级</button>
                                <button class="battle-grade-btn" data-grade="2">二年级</button>
                                <button class="battle-grade-btn" data-grade="3">三年级</button>
                                <button class="battle-grade-btn" data-grade="4">四年级</button>
                                <button class="battle-grade-btn" data-grade="5">五年级</button>
                            </div>
                        </div>
                        
                        <div class="config-item">
                            <label>题目数量</label>
                            <div class="question-count-btns">
                                <button class="qcount-btn" data-count="10">10题</button>
                                <button class="qcount-btn active" data-count="20">20题</button>
                                <button class="qcount-btn" data-count="30">30题</button>
                                <button class="qcount-btn" data-count="50">50题</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="player-names" id="player-names">
                        <div class="player-name-input">
                            <span class="player-avatar" style="background: #ff6b6b;">🚀</span>
                            <input type="text" class="pname-input" placeholder="选手1名字" value="选手1">
                        </div>
                        <div class="player-name-input">
                            <span class="player-avatar" style="background: #4ecdc4;">⚡</span>
                            <input type="text" class="pname-input" placeholder="选手2名字" value="选手2">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="battle-start-btn" id="battle-start-btn">开始比赛</button>
                    </div>
                </div>
                
                <!-- 比赛进行中 -->
                <div class="battle-playing" id="battle-playing" style="display: none;">
                    <div class="battle-header">
                        <h2 class="battle-title">比赛进行中</h2>
                        <div class="battle-timer" id="battle-timer">⏱️ 0秒</div>
                    </div>
                    
                    <div class="battle-players-status" id="battle-players-status">
                    </div>
                    
                    <div class="battle-current-player" id="battle-current-player">
                    </div>
                    
                    <div class="battle-question-area" id="battle-question-area">
                        <div class="battle-question-display" id="battle-question-display"></div>
                        <div class="battle-progress" id="battle-progress"></div>
                    </div>
                    
                    <div class="battle-answer-area" id="battle-answer-area">
                        <input type="text" class="battle-answer-input" id="battle-answer-input" placeholder="输入答案后按回车" autocomplete="off">
                    </div>
                    
                    <div class="battle-feedback" id="battle-feedback"></div>
                </div>
                
                <!-- 比赛结果 -->
                <div class="battle-result" id="battle-result" style="display: none;">
                    <h2 class="result-title">比赛结束</h2>
                    <div class="result-podium" id="result-podium">
                    </div>
                    <div class="result-details" id="result-details">
                    </div>
                    <div class="action-buttons">
                        <button class="battle-start-btn" id="battle-restart-btn">再来一局</button>
                        <button class="back-btn" id="battle-back-btn">返回设置</button>
                    </div>
                </div>
            </section>
            
            <!-- 错题本区域 -->
            <section class="wrong-section" id="wrong-section" style="display: none;">
                <h2>错题本</h2>
                <div class="wrong-container" id="wrong-container">
                </div>
                <div class="action-buttons">
                    <button class="back-btn" id="back-from-wrong">返回练习</button>
                </div>
            </section>
            
            <!-- 练习历史区域 -->
            <section class="history-section" id="history-section" style="display: none;">
                <h2>冒险日志</h2>
                <div class="history-container" id="history-container">
                </div>
                <div class="action-buttons">
                    <button class="back-btn" id="back-from-history">返回练习</button>
                </div>
            </section>
            
            <!-- 我的奖励区域 -->
            <section class="rewards-section" id="rewards-section" style="display: none;">
                <h2>我的奖励</h2>
                <div class="rewards-container">
                    <div class="rewards-summary">
                        <div class="reward-card">
                            <div class="reward-icon">⭐</div>
                            <div class="reward-value" id="total-stars">0</div>
                            <div class="reward-label">总星星</div>
                        </div>
                        <div class="reward-card">
                            <div class="reward-icon">🏆</div>
                            <div class="reward-value" id="total-trophies">0</div>
                            <div class="reward-label">总奖杯</div>
                        </div>
                        <div class="reward-card">
                            <div class="reward-icon">🎯</div>
                            <div class="reward-value" id="total-score">0</div>
                            <div class="reward-label">总积分</div>
                        </div>
                    </div>
                    
                    <div class="rewards-achievements">
                        <h3>成就系统</h3>
                        <div class="achievements-container" id="achievements-container">
                        </div>
                    </div>
                    
                    <div class="rewards-badges">
                        <h3>徽章收集</h3>
                        <div class="badges-container" id="badges-container">
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="back-btn" id="back-from-rewards">返回练习</button>
                    <button class="clear-data-btn" id="clear-data-btn">清除数据</button>
                </div>
            </section>
        </main>
    </div>
    
    <script src="script.js?v=2026060607"></script>
</body>
</html>
